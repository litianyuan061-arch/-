<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b3d2c" />
  <title>德州扑克 · 好友房</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 大厅 -->
  <section id="lobby" class="screen">
    <div class="lobby-card">
      <h1>♠ 德州扑克 ♥</h1>
      <p class="subtitle">创建房间，把链接发给朋友，一起开局</p>

      <label class="field">
        <span>你的昵称</span>
        <input id="nameInput" maxlength="12" placeholder="输入昵称" autocomplete="nickname" />
      </label>

      <div id="joinBox" class="box">
        <h2>加入房间</h2>
        <div class="row">
          <input id="codeInput" maxlength="5" placeholder="房间号" autocapitalize="characters" />
          <button id="joinBtn" class="btn primary">加入</button>
        </div>
      </div>

      <div class="box">
        <h2>创建房间</h2>
        <div class="grid3">
          <label class="field small"><span>大盲</span><input id="bbInput" type="number" value="20" min="2" /></label>
          <label class="field small"><span>初始筹码</span><input id="chipsInput" type="number" value="1000" min="20" /></label>
          <label class="field small"><span>座位数</span>
            <select id="seatsInput">
              <option>2</option><option>3</option><option>4</option><option>5</option>
              <option selected>6</option><option>7</option><option>8</option><option>9</option>
            </select>
          </label>
        </div>
        <button id="createBtn" class="btn gold wide">创建房间并邀请好友</button>
      </div>
      <p id="lobbyError" class="error"></p>
    </div>
  </section>

  <!-- 牌桌 -->
  <section id="game" class="screen hidden">
    <header class="topbar">
      <button id="leaveBtn" class="btn ghost small">离开</button>
      <div class="room-info">
        房间 <b id="roomCode">-----</b>
        <span id="blindsInfo" class="muted"></span>
      </div>
      <button id="inviteBtn" class="btn gold small">邀请好友</button>
    </header>

    <div class="table-wrap">
      <div id="table" class="table">
        <div class="felt">
          <div id="pot" class="pot"></div>
          <div id="board" class="board"></div>
          <div id="centerMsg" class="center-msg"></div>
        </div>
        <div id="seats"></div>
      </div>
    </div>

    <div id="resultBanner" class="result-banner hidden"></div>

    <footer class="controls">
      <div id="hostControls" class="hidden">
        <button id="startBtn" class="btn gold wide">开始游戏</button>
      </div>
      <div id="rebuyControls" class="hidden">
        <button id="rebuyBtn" class="btn primary wide">补充筹码</button>
      </div>
      <div id="actionControls" class="hidden">
        <div id="raisePanel" class="raise-panel hidden">
          <div class="presets">
            <button data-frac="0.5" class="btn ghost small">½ 池</button>
            <button data-frac="0.75" class="btn ghost small">¾ 池</button>
            <button data-frac="1" class="btn ghost small">1 池</button>
            <button data-frac="all" class="btn ghost small">全下</button>
          </div>
          <div class="row">
            <input id="raiseSlider" type="range" />
            <input id="raiseAmount" type="number" />
          </div>
        </div>
        <div class="actions">
          <button id="foldBtn" class="btn danger">弃牌</button>
          <button id="callBtn" class="btn primary">过牌</button>
          <button id="raiseBtn" class="btn gold">加注</button>
        </div>
      </div>
      <div id="waitMsg" class="wait-msg"></div>
    </footer>

    <button id="chatToggle" class="chat-toggle" aria-label="聊天">💬<span id="chatBadge" class="badge hidden"></span></button>
    <aside id="chatPanel" class="chat-panel hidden">
      <div class="chat-head">
        <b>聊天 / 记录</b>
        <button id="chatClose" class="btn ghost small">关闭</button>
      </div>
      <div id="chatLog" class="chat-log"></div>
      <form id="chatForm" class="row">
        <input id="chatInput" maxlength="200" placeholder="说点什么…" autocomplete="off" />
        <button class="btn primary small">发送</button>
      </form>
    </aside>
  </section>

  <div id="inviteModal" class="modal hidden">
    <div class="modal-card">
      <div class="chat-head">
        <b>邀请好友</b>
        <button id="inviteClose" class="btn ghost small">关闭</button>
      </div>
      <p class="muted">把链接发给朋友，打开就能加入。也可以让朋友在首页输入房间号：</p>
      <div id="inviteCode" class="invite-code"></div>
      <input id="inviteLink" readonly />
      <button id="copyLinkBtn" class="btn gold wide">复制邀请链接</button>
      <button id="shareBtn" class="btn ghost wide hidden">更多分享方式</button>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
